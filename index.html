<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daria Cotocu · Projects</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --text-muted: #5f6368;
    --border: #e3e3e6;
    --accent: #2f6feb;
    --accent-soft: #eef3fe;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card-bg: #161922;
      --text: #eaeaec;
      --text-muted: #9aa0a6;
      --border: #262b36;
      --accent: #6ea0ff;
      --accent-soft: #1b2436;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 8px rgba(0,0,0,0.25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 48px 20px 80px;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 40px;
  }
  h1 {
    font-size: 1.9rem;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--text-muted);
    margin: 0;
    font-size: 1rem;
  }
  header a {
    color: var(--accent);
    text-decoration: none;
  }
  header a:hover { text-decoration: underline; }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .controls input {
    flex: 1;
    min-width: 160px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.95rem;
  }
  .controls input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .card-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
    word-break: break-word;
  }
  .card-desc {
    font-size: 0.88rem;
    color: var(--text-muted);
    line-height: 1.4;
    flex: 1;
    min-height: 1.2em;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .lang-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  .status {
    color: var(--text-muted);
    font-size: 0.95rem;
    padding: 40px 0;
    text-align: center;
  }
  .status a { color: var(--accent); }

  footer {
    margin-top: 48px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Daria Cotocu</h1>
      <p>Projects on <a href="https://github.com/dariacotocu" target="_blank" rel="noopener">GitHub</a></p>
    </header>

    <div class="controls">
      <input id="search" type="text" placeholder="Filter repositories…" autocomplete="off">
    </div>

    <div id="status" class="status">Loading repositories…</div>
    <div id="grid" class="grid"></div>

    <footer>
      Built with GitHub Pages · repo list loads live from the GitHub API
    </footer>
  </div>

<script>
  const USERNAME = "dariacotocu";
  const grid = document.getElementById("grid");
  const statusEl = document.getElementById("status");
  const searchEl = document.getElementById("search");

  const langColors = {
    JavaScript: "#f1e05a", TypeScript: "#3178c6", Python: "#3572A5",
    HTML: "#e34c26", CSS: "#563d7c", Java: "#b07219", "C++": "#f34b7d",
    C: "#555555", Go: "#00ADD8", Rust: "#dea584", Ruby: "#701516",
    Shell: "#89e051", Swift: "#ffac45", PHP: "#4F5D95", Vue: "#41b883",
    Jupyter: "#DA5B0B"
  };

  let allRepos = [];

  function render(repos) {
    grid.innerHTML = "";
    if (repos.length === 0) {
      grid.innerHTML = '<p class="status">No repositories match.</p>';
      return;
    }
    for (const repo of repos) {
      const card = document.createElement("a");
      card.className = "card";
      card.href = repo.html_url;
      card.target = "_blank";
      card.rel = "noopener";

      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = repo.name;

      const desc = document.createElement("div");
      desc.className = "card-desc";
      desc.textContent = repo.description || "No description provided.";

      const meta = document.createElement("div");
      meta.className = "card-meta";

      let metaHTML = "";
      if (repo.language) {
        const color = langColors[repo.language] || "var(--accent)";
        metaHTML += `<span class="meta-item"><span class="lang-dot" style="background:${color}"></span>${repo.language}</span>`;
      }
      metaHTML += `<span class="meta-item">★ ${repo.stargazers_count}</span>`;
      if (repo.forks_count) {
        metaHTML += `<span class="meta-item">⑂ ${repo.forks_count}</span>`;
      }
      meta.innerHTML = metaHTML;

      card.appendChild(title);
      card.appendChild(desc);
      card.appendChild(meta);
      grid.appendChild(card);
    }
  }

  async function loadRepos() {
    try {
      const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`);
      if (!res.ok) throw new Error(`GitHub API responded ${res.status}`);
      const data = await res.json();
      allRepos = data
        .filter(r => !r.fork)
        .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));
      statusEl.style.display = "none";
      render(allRepos);
    } catch (err) {
      statusEl.textContent = "Couldn't load repositories right now — visit ";
      const link = document.createElement("a");
      link.href = `https://github.com/${USERNAME}?tab=repositories`;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "github.com/" + USERNAME;
      statusEl.appendChild(link);
      statusEl.append(" directly.");
    }
  }

  searchEl.addEventListener("input", () => {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = allRepos.filter(r =>
      r.name.toLowerCase().includes(q) ||
      (r.description || "").toLowerCase().includes(q)
    );
    render(filtered);
  });

  loadRepos();
</script>
</body>
</html>
